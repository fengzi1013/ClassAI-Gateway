<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手</title>
    <!-- Markdown解析库 marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            background-color: #ffffff;
            color: #212121;
            overflow: hidden;
        }
        /* ========== 左侧侧边栏（仅保留新建对话按钮） ========== */
        .sidebar {
            width: 260px;
            background-color: #f7f7f8;
            border-right: 1px solid #e5e5e7;
            display: flex;
            flex-direction: column;
            padding:16px;
        }
        .new-chat-btn {
            width:100%;
            border:1px solid #d8d8db;
            background:#fff;
            border-radius:10px;
            padding:10px 12px;
            font-size:14px;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .new-chat-btn:hover {
            background-color:#efeff0;
        }
        /* ========== 主对话区域 ========== */
        .main-container {
            flex:1;
            display:flex;
            flex-direction:column;
            height:100%;
        }
        .chat-wrap {
            flex:1;
            overflow-y:auto;
            padding:32px max(16px, calc((100% - 820px)/2));
        }
        /* 页面加载欢迎提示 */
        .welcome-tip {
            text-align:center;
            font-size:18px;
            color:#444;
            margin:40px 0 60px;
        }
        .msg-item {
            max-width:820px;
            margin:0 auto 24px;
            display:flex;
            gap:16px;
        }
        .msg-avatar {
            width:32px;
            height:32px;
            border-radius:6px;
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
        }
        .ai .msg-avatar {
            background:#2563eb;
            color:white;
        }
        .user .msg-avatar {
            background:#e5e7eb;
            color:#333;
        }
        .msg-content {
            flex:1;
            line-height:1.6;
            font-size:15px;
        }
        .msg-img {
            max-width:420px;
            border-radius:10px;
            margin-top:8px;
        }
        .msg-file-item{
            display:inline-flex;
            align-items:center;
            gap:6px;
            background:#f3f4f6;
            padding:6px 10px;
            border-radius:8px;
            margin-top:8px;
        }
        /* markdown 样式 */
        .msg-content pre {
            background:#f4f4f5;
            padding:12px;
            border-radius:8px;
            overflow-x:auto;
            margin:8px 0;
        }
        .msg-content code {
            background:#f4f4f5;
            padding:2px 4px;
            border-radius:4px;
        }
        .msg-content pre code {
            background:transparent;
            padding:0;
        }
        .msg-content p {
            margin:8px 0;
        }
        .msg-content ul,ol {
            padding-left:24px;
            margin:8px 0;
        }
        /* ========== 底部输入框区域 ========== */
        .input-area {
            padding:16px max(16px, calc((100% - 820px)/2));
        }
        .input-box {
            border:1px solid #d1d5db;
            border-radius:18px;
            padding:12px 16px;
            background:#fff;
        }
        /* 输入框内图片+文件预览容器 */
        .preview-wrap {
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            margin-bottom:10px;
        }
        .thumb-img {
            width:70px;
            height:70px;
            object-fit:cover;
            border-radius:8px;
            cursor:pointer;
            border:1px solid #eee;
            position:relative;
        }
        .file-preview{
            display:flex;
            align-items:center;
            gap:6px;
            background:#f3f4f6;
            padding:8px 10px;
            border-radius:8px;
            font-size:14px;
            max-width:200px;
        }
        .remove-btn{
            width:18px;height:18px;
            border-radius:50%;
            background:#999;
            color:#fff;
            border:none;
            cursor:pointer;
            font-size:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-left:4px;
        }
        .thumb-img:hover {
            opacity:0.85;
        }
        .input-row {
            display:flex;
            align-items:flex-end;
            gap:10px;
        }
        textarea {
            flex:1;
            border:none;
            outline:none;
            min-height:24px;
            max-height:160px;
            resize:none;
            font-size:15px;
        }
        .tool-bar {
            display:flex;
            align-items:center;
            gap:8px;
        }
        .icon-btn {
            border:none;
            background:none;
            font-size:18px;
            cursor:pointer;
            color:#666;
            padding:4px;
        }
        .send-btn {
            background:#2563eb;
            color:#fff;
            border:none;
            border-radius:999px;
            width:34px;
            height:34px;
            cursor:pointer;
        }
        .send-btn:disabled {
            background:#b4c4e8;
            cursor:not-allowed;
        }
        /* 图片全屏预览弹窗 */
        .img-modal {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.82);
            display:none;
            z-index:999;
            align-items:center;
            justify-content:center;
        }
        .img-modal.show {
            display:flex;
        }
        .modal-img {
            max-width:90%;
            max-height:90vh;
            border-radius:8px;
        }
        /* 光标闪烁效果 */
        .typing-cursor{
            display:inline-block;
            width:7px;
            height:16px;
            background:#333;
            animation: blink 0.8s infinite;
        }
        @keyframes blink{
            0%,50%{opacity:1;}
            51%,100%{opacity:0;}
        }
        /* 隐藏真实文件选择框 */
        .hidden-input{
            display:none;
        }
    </style>
</head>
<body>
    <!-- 隐藏的文件input -->
    <input type="file" id="fileUpload" class="hidden-input" multiple>
    <input type="file" id="imgUpload" class="hidden-input" accept="image/*" multiple>
    <!-- 左侧侧边栏，只保留新建对话按钮 -->
    <div class="sidebar">
        <button class="new-chat-btn" id="newChatBtn">➕ 新建对话</button>
    </div>
    <!-- 主区域 -->
    <div class="main-container">
        <div class="chat-wrap" id="chatContainer">
            <!-- 欢迎文字 -->
            <div class="welcome-tip" id="welcomeText">我是你的AI助手，有什么问题都可以问我哦</div>
        </div>
        <div class="input-area">
            <div class="input-box">
                <!-- 输入框内图片、文件预览容器 -->
                <div class="preview-wrap" id="previewWrap"></div>
                <div class="input-row">
                    <textarea id="msgInput" placeholder="输入消息，Shift+Enter换行"></textarea>
                    <div class="tool-bar">
                        <button class="icon-btn" id="btnFile" type="button">📎</button>
                        <button class="icon-btn" id="btnImg" type="button">🖼️</button>
                        <button class="send-btn" id="sendBtn">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 图片预览弹窗 -->
    <div class="img-modal" id="imgModal">
        <img class="modal-img" id="modalImg">
    </div>
    <script>
        // 元素获取
        const chatContainer = document.getElementById('chatContainer');
        const welcomeText = document.getElementById('welcomeText');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const imgUpload = document.getElementById('imgUpload');
        const fileUpload = document.getElementById('fileUpload');
        const btnImg = document.getElementById('btnImg');
        const btnFile = document.getElementById('btnFile');
        const previewWrap = document.getElementById('previewWrap');
        const imgModal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        const newChatBtn = document.getElementById('newChatBtn');
        // ========= 后端对接配置 =========
        const API_URL = "/chat/stream";
        let messages = [];               // 多轮对话上下文
        let pendingAttachments = [];     // 待发送附件 {type:image/file,src?,name?,content?}
        let isSending = false;           // 【新增】防抖标记，判断是否正在请求

        // JS手动触发文件弹窗
        btnImg.onclick = ()=> imgUpload.click();
        btnFile.onclick = ()=> fileUpload.click();
        // 工具：File转base64
        function fileToBase64(file){
            return new Promise(resolve=>{
                const r = new FileReader();
                r.onload = e=>resolve(e.target.result);
                r.readAsDataURL(file);
            })
        }
        // 工具：读取文本类文件
        function readTextFile(file){
            return new Promise(resolve=>{
                const r = new FileReader();
                r.onload = e=>resolve(e.target.result);
                r.readAsText(file);
            })
        }
        // 图片上传逻辑
        imgUpload.onchange = async function(e){
            const files = Array.from(e.target.files);
            for(const file of files){
                const src = await fileToBase64(file);
                const idx = pendingAttachments.length;
                pendingAttachments.push({type:"image", src, name:file.name});
                const wrap = document.createElement('div');
                wrap.className = "thumb-img";
                wrap.dataset.idx = idx;
                wrap.innerHTML = `
                    <img style="width:100%;height:100%;object-fit:cover;border-radius:8px" src="${src}" />
                    <button class="remove-btn" style="position:absolute;top:-6px;right:-6px;">×</button>
                `;
                previewWrap.appendChild(wrap);
                wrap.onclick = (ev)=>{
                    if(ev.target.classList.contains('remove-btn')) return;
                    modalImg.src = src;
                    imgModal.classList.add('show');
                }
                wrap.querySelector('.remove-btn').onclick = (ev)=>{
                    ev.stopPropagation();
                    const delIdx = Number(wrap.dataset.idx);
                    pendingAttachments.splice(delIdx,1);
                    wrap.remove();
                    console.log("删除附件，剩余：",pendingAttachments);
                }
            }
            imgUpload.value = null;
            console.log("图片选择完成，pendingAttachments：",pendingAttachments);
        }
        imgModal.onclick = ()=> imgModal.classList.remove('show');
        // 文件上传逻辑
        fileUpload.onchange = async function(e){
            const files = Array.from(e.target.files);
            for(const file of files){
                const textContent = await readTextFile(file);
                const idx = pendingAttachments.length;
                pendingAttachments.push({type:"file", name:file.name, content:textContent});
                const fileItem = document.createElement('div');
                fileItem.className = "file-preview";
                fileItem.dataset.idx = idx;
                fileItem.innerText = `📄 ${file.name}`;
                const delBtn = document.createElement('button');
                delBtn.className = 'remove-btn';
                delBtn.textContent = '×';
                delBtn.onclick = (ev)=>{
                    ev.stopPropagation();
                    const delIdx = Number(fileItem.dataset.idx);
                    pendingAttachments.splice(delIdx,1);
                    fileItem.remove();
                    console.log("删除附件，剩余：",pendingAttachments);
                }
                fileItem.appendChild(delBtn);
                previewWrap.appendChild(fileItem);
            }
            fileUpload.value = null;
            console.log("文件选择完成，pendingAttachments：",pendingAttachments);
        }
        // 添加用户消息（直接渲染）
        function appendUserMessage(text, attachList){
            welcomeText.style.display = "none";
            const wrap = document.createElement('div');
            wrap.className = `msg-item user`;
            let fileHtml = '';
            attachList.forEach(item=>{
                if(item.type === 'image'){
                    fileHtml += `<img class="msg-img" src="${item.src}">`;
                }else{
                    fileHtml += `<div class="msg-file-item">📄 ${item.name}</div>`
                }
            })
            wrap.innerHTML = `
                <div class="msg-avatar">我</div>
                <div class="msg-content">
                    <div>${marked.parse(text)}</div>
                    ${fileHtml}
                </div>
            `;
            chatContainer.appendChild(wrap);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        // 创建AI消息DOM，返回dom引用用于流式写入
        function createAiMessageDom(){
            welcomeText.style.display = "none";
            const wrap = document.createElement('div');
            wrap.className = `msg-item ai`;
            wrap.innerHTML = `
                <div class="msg-avatar">AI</div>
                <div class="msg-content">
                    <div id="ai-stream"><span class="typing-cursor"></span></div>
                </div>
            `;
            chatContainer.appendChild(wrap);
            const dom = wrap.querySelector('#ai-stream');
            return dom;
        }
        // 发送消息对接后端SSE【增加防抖】
        async function sendMessage(){
            // 防抖：正在发送，直接忽略重复点击/回车
            if(isSending) return;

            const text = msgInput.value.trim();
            if(!text && pendingAttachments.length ===0) return;

            isSending = true; // 标记进入发送状态
            sendBtn.disabled = true;
            console.log("点击发送，附件数组：",pendingAttachments);
            // 组装传给后端的user content数组（deepseek多模态格式）
            let userContent = [];
            userContent.push({type:"text", text:text});
            pendingAttachments.forEach(at=>{
                if(at.type==="image"){
                    userContent.push({type:"image_url", image_url:{url:at.src}});
                }else if(at.type==="file"){
                    userContent.push({type:"text", text:`【文件${at.name}】\n${at.content}`});
                }
            })
            console.log("组装后的userContent",userContent);
            // 渲染用户气泡
            appendUserMessage(text, pendingAttachments);
            // 存入上下文
            messages.push({role:"user", content:userContent});
            // 清空输入区
            msgInput.value = "";
            previewWrap.innerHTML = "";
            pendingAttachments = [];
            // 判断是否包含图片，选择模型
            const hasImage = messages.some(m=>{
                if(Array.isArray(m.content)) return m.content.some(c=>c.type==="image_url");
                return false;
            })
            const modelName = hasImage ? "deepseek-flash" : "deepseek-v4-pro";
            console.log("使用模型：",modelName);
            // 创建AI气泡
            const aiDom = createAiMessageDom();
            let aiFullText = "";
            try{
                const resp = await fetch(API_URL,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                        model: modelName,
                        messages: messages,
                        stream:true
                    })
                })
                if(!resp.ok){
                    throw new Error(`HTTP ${resp.status}`);
                }
                const reader = resp.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                while(true){
                    const {done,value} = await reader.read();
                    if(done) break;
                    buffer += decoder.decode(value,{stream:true});
                    const chunks = buffer.split("\n\n");
                    buffer = chunks.pop();
                    for(let piece of chunks){
                        if(!piece.startsWith("data: ")) continue;
                        let dataStr = piece.slice(6);
                        if(dataStr.trim() === "[DONE]") continue;
                        try{
                            const obj = JSON.parse(dataStr);
                            if(obj.error){
                                alert(obj.error);
                                aiFullText += `\n【系统报错】${obj.error}`;
                                aiDom.innerHTML = marked.parse(aiFullText);
                                messages.push({role:"assistant", content:aiFullText});
                                return;
                            }
                            if(obj.choices && obj.choices[0].delta && obj.choices[0].delta.content){
                                aiFullText += obj.choices[0].delta.content;
                                aiDom.innerHTML = marked.parse(aiFullText)+`<span class="typing-cursor"></span>`;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        }catch(e){
                            // json解析异常跳过
                        }
                    }
                }
                // 流结束，去掉光标，保存assistant消息
                aiDom.innerHTML = marked.parse(aiFullText);
                messages.push({role:"assistant", content:aiFullText});
            }catch(err){
                aiFullText += `\n【网络异常】${err.message}`;
                aiDom.innerHTML = marked.parse(aiFullText);
                alert("请求异常："+err.message);
            }finally{
                // 无论成功失败，解除锁定
                isSending = false;
                sendBtn.disabled = false;
            }
        }
        sendBtn.onclick = sendMessage;
        // Enter发送，Shift+Enter换行
        msgInput.addEventListener('keydown', (e)=>{
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        })
        // 新建对话：清空DOM + 清空会话上下文 + 清空附件
        newChatBtn.onclick = ()=>{
            chatContainer.innerHTML = "";
            chatContainer.appendChild(welcomeText);
            welcomeText.style.display = "block";
            previewWrap.innerHTML = "";
            msgInput.value = "";
            messages = [];
            pendingAttachments = [];
            console.log("新建对话，全部清空");
        }
    </script>
</body>
</html>
